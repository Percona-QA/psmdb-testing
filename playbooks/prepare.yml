---
- name: Prepare node for running tests
  hosts: all
  become: true
  become_method: "{{ ansible_become_method | default('sudo') }}"
  gather_facts: true
  tasks:
    - name: Execute storage expansion tasks for RHEL8
      block:
        - name: Dynamically find physical volume backing rootvg
          command: pvs --noheadings -o pv_name -S vg_name=rootvg
          register: pv_check
          changed_when: false

        - name: Set dynamic disk and partition variables
          set_fact:
            root_pv: "{{ pv_check.stdout | trim }}"
            root_disk: "{{ (pv_check.stdout | trim) | regex_replace('p?[0-9]+$', '') }}"
            root_part_num: "{{ (pv_check.stdout | trim) | regex_search('[0-9]+$') }}"

        - name: Print the dynamically discovered disk variables
          debug:
            msg:
              - "Discovered Physical Volume: {{ root_pv }}"
              - "Target Base Disk: {{ root_disk }}"
              - "Target Partition Number: {{ root_part_num }}"

        - name: Grow underlying physical partition dynamically
          command: "growpart {{ root_disk }} {{ root_part_num }}"
          register: growpart_out
          failed_when:
            - growpart_out.rc != 0
            - "'NOCHANGE' not in growpart_out.stdout"
          changed_when: "'CHANGED' in growpart_out.stdout"

        - name: Resize PV and extend LVs when partition was grown
          block:
            - name: Resize the physical volume to recognize new space
              command: "pvresize {{ root_pv }}"

            - name: Extend tmplv to exactly 10GB and resize filesystem
              lvol:
                vg: rootvg
                lv: tmplv
                size: 10G
                resizefs: true

            - name: Extend varlv to exactly 10GB and resize filesystem
              lvol:
                vg: rootvg
                lv: varlv
                size: 10G
                resizefs: true

            - name: Extend logical volume to 100% of free space and resize filesystem
              lvol:
                vg: rootvg
                lv: rootlv
                size: +100%FREE
                resizefs: true
          when: growpart_out.changed
      when:
      - ansible_os_family == "RedHat"
      - ansible_distribution_major_version == "8"
      - ansible_facts.lvm.vgs.rootvg is defined

    - name: Check disk space on root partition
      command: df -h
      register: df_output
      changed_when: false

    - name: Show disk space on root partition
      debug:
        var: df_output.stdout_lines

    - name: install GPG key for epel 8
      rpm_key:
        state: present
        key: https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-8
      when: ansible_os_family == "RedHat" and ansible_distribution_major_version == "8"

    - name: install GPG key for epel 7
      rpm_key:
        state: present
        key: https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-7
      when: ansible_os_family == "RedHat" and ansible_distribution_major_version == "7"

    - name: install GPG key for Percona repos
      rpm_key:
        state: present
        key: https://repo.percona.com/yum/RPM-GPG-KEY-Percona
      when: ansible_os_family == "RedHat" and ansible_distribution_major_version == "8"

    - name: setup epel 8 repo
      yum: name=https://dl.fedoraproject.org/pub/epel/epel-release-latest-8.noarch.rpm state=present
      when: ansible_os_family == "RedHat" and ansible_distribution_major_version == "8"

    - name: setup epel 7 repo
      yum: name=https://dl.fedoraproject.org/pub/archive/epel/7/x86_64/Packages/e/epel-release-7-14.noarch.rpm state=present
      when: ansible_os_family == "RedHat" and ansible_distribution_major_version == "7"

    - name: add the Vault and epel CentOS 6 repos
      shell: |
        curl https://www.getpagespeed.com/files/centos6-eol.repo --output /etc/yum.repos.d/CentOS-Base.repo
        curl https://www.getpagespeed.com/files/centos6-epel-eol.repo --output /etc/yum.repos.d/epel.repo
        yum -y install centos-release-scl
        curl https://www.getpagespeed.com/files/centos6-scl-eol.repo --output /etc/yum.repos.d/CentOS-SCLo-scl.repo
        curl https://www.getpagespeed.com/files/centos6-scl-rh-eol.repo --output /etc/yum.repos.d/CentOS-SCLo-scl-rh.repo
        yum -y install epel-release.noarch
      when: ansible_os_family == "RedHat" and ansible_distribution_major_version == "6"

    - name: setup ca-certificates release
      yum:
        name: ca-certificates
        update_cache: yes
        state: present
      when: ansible_os_family == "RedHat"

    - name: allow release-info to change for apt repositories
      command: apt-get update -y --allow-releaseinfo-change
      when: ansible_os_family == "Debian" and ansible_distribution_release == "buster"

    - name: Remove bullseye-backports entries from apt sources
      replace:
        path: /etc/apt/sources.list
        regexp: '^(deb.*bullseye-backports)'
        replace: '# \1'
      when: ansible_distribution_release == 'bullseye'

    - name: Point archived Debian 11 apt mirrors at archive.debian.org
      shell: |
        set -euo pipefail
        cat > /etc/apt/apt.conf.d/99debian-archive << 'EOF'
        Acquire::Check-Valid-Until "false";
        Acquire::AllowReleaseInfoChange "true";
        EOF
        # A Default-Release pin keeps the older bullseye point-release as the
        # candidate and then conflicts with security updates already installed.
        shopt -s nullglob
        for f in /etc/apt/apt.conf.d/*; do
          [ -f "$f" ] || continue
          sed -i -E '/APT::Default-Release/d' "$f"
        done
        mkdir -p /etc/apt/sources.list.d
        for f in /etc/apt/sources.list.d/*; do
          [ -f "$f" ] || continue
          case "$f" in
            *.disabled) continue ;;
          esac
          if grep -Eq 'debian\.org|debian-security|bullseye' "$f"; then
            mv "$f" "$f.disabled"
          fi
        done
        cat > /etc/apt/sources.list << 'EOF'
        deb http://archive.debian.org/debian bullseye main
        deb http://archive.debian.org/debian bullseye-updates main
        deb http://archive.debian.org/debian-security bullseye-security main
        EOF
        apt-get update
        # grub-pc postinst exits when the recorded install disk is missing.
        # Vagrant has no interactive debconf, so point it at the root disk.
        grub_disk="$(findmnt -n -o SOURCE / | sed -E 's/p?[0-9]+$//')"
        if [ ! -b "$grub_disk" ]; then
          grub_disk=/dev/sda
        fi
        debconf-set-selections <<EOF
        grub-pc grub-pc/install_devices multiselect $grub_disk
        grub-pc grub-pc/install_devices_disks_changed multiselect $grub_disk
        grub-pc grub-pc/install_devices_empty boolean false
        EOF
        export DEBIAN_FRONTEND=noninteractive
        dpkg --configure -a || true
        if ! apt-get -y \
          -o Dpkg::Options::=--force-confdef \
          -o Dpkg::Options::=--force-confold \
          dist-upgrade; then
          debconf-set-selections <<EOF
        grub-pc grub-pc/install_devices_empty boolean true
        grub-pc grub-pc/install_devices multiselect
        EOF
          dpkg --configure -a
          apt-get -y \
            -o Dpkg::Options::=--force-confdef \
            -o Dpkg::Options::=--force-confold \
            -f install
        fi
      args:
        executable: /bin/bash
      when: ansible_distribution == "Debian" and ansible_distribution_major_version == "11"

    - name: install needed packages for running tests with apt
      apt:
        name: "{{ packages }}"
        update_cache: yes
        state: latest
      vars:
        packages:
          - unzip
          - wget
          - gnupg
          - gnupg2
          - rsync
          - acl
          - git
      retries: 60
      delay: 10
      register: result
      until: result is not failed
      when: ansible_os_family == "Debian"

    - name: update systemd-sysv integration on debian/ubuntu
      apt:
        name: "{{ packages }}"
        update_cache: yes
        state: latest
      vars:
        packages:
        - systemd-sysv
      when: ansible_os_family == "Debian" and ansible_distribution_release != "trusty"

    - name: Check if there are broken CentOS7 repos
      stat:
        path: /etc/yum.repos.d/CentOS-Base.repo
      register: repo_file

    - name: fix repos for CentOS7
      shell:
       cmd: |
        for f in /etc/yum.repos.d/CentOS-*.repo; do
          [ -f "$f" ] || continue
          sed -i \
            -e 's/mirror.centos.org/vault.centos.org/g' \
            -e 's#https://vault.centos.org#http://vault.centos.org#g' \
            "$f"
        done
        # CentOS-Base.repo is the only file whose sections stay active while
        # baseurl is commented. Other CentOS-*.repo files comment the whole
        # stanza, including the [section] line. Uncommenting only baseurl=
        # there leaves a directive outside any section and yum rejects the file.
        sed -i \
          -e 's/^# *baseurl=/baseurl=/g' \
          -e 's/^mirrorlist=/#mirrorlist=/g' \
          /etc/yum.repos.d/CentOS-Base.repo
        grep -q '^sslverify=' /etc/yum.conf || echo 'sslverify=false' >> /etc/yum.conf
        yum clean all
      args:
        executable: /bin/bash
      when: ansible_os_family == "RedHat" and ansible_distribution_major_version == "7" and repo_file.stat.exists

    - name: install needed packages for running tests with yum
      yum:
        name: "{{ packages }}"
        state: latest
      vars:
        packages:
          - pv
          - libselinux-python
          - unzip
          - wget
          - rsync
          - git
      when: ansible_os_family == "RedHat" and ansible_distribution_major_version|int <= 7

    - name: install needed packages for running tests with yum on RHEL8
      yum:
        name: "{{ packages }}"
        state: latest
      vars:
        packages:
        - unzip
        - git
        - wget
      when: ansible_os_family == "RedHat" and ansible_distribution_major_version|int >= 8

    - name: Install necessary tools for AL
      yum:
        name: "{{ packages }}"
      vars:
        packages:
        - tar
        - iproute
        - openssl
      when: ansible_distribution == "Amazon"

    - set_fact:
        ssh_pubkey: "{{ lookup('env', 'SSH_PUBKEY') | default('none', true) }}"

    - set_fact:
        ssh_user: "{{ lookup('env', 'SSH_USER') | default('none', true) }}"

    - name: Add user to Redhat
      user:
        name: "{{ ssh_user }}"
        shell: /bin/bash
        groups: wheel
        append: yes
      when: ssh_user != "none" and ssh_pubkey != "none" and ansible_facts['os_family'] == 'RedHat'

    - name: Add user to Debian
      user:
        name: "{{ ssh_user }}"
        shell: /bin/bash
        groups: sudo
        append: yes
      when: ssh_user != "none" and ssh_pubkey != "none" and ansible_facts['os_family'] == 'Debian'

    - name: Add pub key
      authorized_key:
        user: "{{ ssh_user }}"
        state: present
        key: "{{ ssh_pubkey }}"
      when: ssh_user != "none" and ssh_pubkey != "none"

    - name: Allow sudo without password
      lineinfile:
        dest: /etc/sudoers
        state: present
        regexp: '^%wheel'
        line: '%wheel ALL=(ALL) NOPASSWD: ALL'
      when: ssh_user != "none" and ssh_pubkey != "none" and ansible_facts['os_family'] == 'RedHat'

    - name: Allow sudo without password
      lineinfile:
        dest: /etc/sudoers
        state: present
        regexp: '^%sudo'
        line: '%sudo ALL=(ALL) NOPASSWD: ALL'
      when: ssh_user != "none" and ssh_pubkey != "none" and ansible_facts['os_family'] == 'Debian'
