---
dependency:
  name: galaxy
driver:
  name: vagrant
  provision: true
  provider:
    name: virtualbox
platforms:
  - name: centos-7
    box: generic/centos7
    memory: 4096
    cpus: 2
    instance_raw_config_args:
      - "vm.provision 'shell', inline: 'if ! command -v python3 >/dev/null 2>&1; then if [ -f /etc/yum.repos.d/CentOS-Base.repo ]; then sed -i \"s/mirror.centos.org/vault.centos.org/g; s/mirrorlist.centos.org/vault.centos.org/g; s/^#.*baseurl=http/baseurl=http/; s/^mirrorlist=http/#mirrorlist=http/; s#https://vault.centos.org#http://vault.centos.org#g\" /etc/yum.repos.d/CentOS-Base.repo; grep -q ^sslverify= /etc/yum.conf || echo sslverify=false >> /etc/yum.conf; yum clean all; fi; yum -y install python3 ca-certificates; fi'"
    provider_raw_config_args:
      - "customize ['modifyvm', :id, '--natdnshostresolver1', 'on']"
provisioner:
  name: ansible
  log: true
  config_options:
    defaults:
      interpreter_python: auto_silent
      host_key_checking: false
  inventory:
    group_vars:
      all:
        ansible_python_interpreter: /usr/bin/python3
  playbooks:
    prepare: ../../../../playbooks/prepare.yml
    cleanup: ../../playbooks/cleanup.yml
    converge: ../../playbooks/playbook.yml
verifier:
  name: testinfra
  directory: ../../../tests/
  additional_files_or_dirs:
    - ../psmdb-custom/tests/
  options:
    verbose: true
    s: true
    junitxml: centos-7-vagrant-report.xml
scenario:
  name: centos-7-vagrant
  destroy_sequence:
    - destroy
  cleanup_sequence:
    - cleanup
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - verify
    - destroy
