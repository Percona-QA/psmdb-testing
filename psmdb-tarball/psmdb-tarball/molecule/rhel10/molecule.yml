---
dependency:
  name: galaxy
driver:
  name: ec2
platforms:
  - name: rhel10-${BUILD_NUMBER}-${JOB_NAME}
    region: us-west-2
    image: "${MOLECULE_RHEL10_AMI:-ami-0da467f007dfebd6b}"
    vpc_subnet_id: subnet-07f71e1a3117a32f9
    instance_type: ${INSTANCE_TYPE:-t2.medium}
    ssh_user: ec2-user
    root_device_name: /dev/sda1
    instance_tags:
      iit-billing-tag: jenkins-psmdb-worker
      job-name: ${JOB_NAME}
provisioner:
  name: ansible
  log: True
  playbooks:
    create: ../../../../playbooks/create.yml
    destroy: ../../../../playbooks/destroy.yml
    prepare: ../../playbooks/prepare.yml
    cleanup: ../../playbooks/cleanup.yml
    converge: ../../playbooks/playbook.yml
  env:
    ANSIBLE_SSH_TRANSFER_METHOD: piped
verifier:
  name: testinfra
  directory: ../../tests/
  options:
    verbose: true
    capture: sys
    o: junit_logging=system-out
    junitxml: rhel10-report.xml
scenario:
  name: rhel10
  destroy_sequence:
    - destroy
  cleanup_sequence:
    - cleanup
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
