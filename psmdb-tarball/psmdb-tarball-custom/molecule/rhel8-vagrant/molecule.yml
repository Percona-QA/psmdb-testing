---
dependency:
  name: galaxy
driver:
  name: vagrant
  provision: true
  provider:
    name: virtualbox
platforms:
  - name: rhel8
    box: generic/rhel8
    memory: 4096
    cpus: 2
    instance_raw_config_args:
      - "vm.provision 'shell', inline: 'if ! command -v python3 >/dev/null 2>&1; then if command -v apt-get >/dev/null 2>&1; then apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y python3; elif command -v dnf >/dev/null 2>&1; then dnf -y install python3; else yum -y install python3; fi; fi'"
    provider_raw_config_args:
      - "customize ['modifyvm', :id, '--natdnshostresolver1', 'on']"
provisioner:
  name: ansible
  log: true
  config_options:
    defaults:
      interpreter_python: auto_silent
      host_key_checking: false
  inventory:
    group_vars:
      all:
        ansible_python_interpreter: /usr/bin/python3
  env:
    REPO: ${REPO:-testing}
    JOB_NAME: ${JOB_NAME:-local}
    LOCAL_TESTING: "${LOCAL_TESTING:-true}"
  playbooks:
    prepare: ../../playbooks/prepare.yml
    cleanup: ../../playbooks/cleanup.yml
    converge: ../../playbooks/playbook.yml
verifier:
  name: testinfra
  directory: ../../tests/
  env:
    LOCAL_TESTING: "${LOCAL_TESTING:-true}"
  options:
    verbose: true
    capture: sys
    o: junit_logging=system-out
    junitxml: rhel8-vagrant-report.xml
scenario:
  name: rhel8-vagrant
  destroy_sequence:
    - destroy
  cleanup_sequence:
    - cleanup
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - verify
    - destroy
