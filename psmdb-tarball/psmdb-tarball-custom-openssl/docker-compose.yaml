services:
  test:
    hostname: test
    build:
      dockerfile: Dockerfile.test
      context: .
    volumes:
      - .:/os-smoke
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - OS_IMAGE=${OS_IMAGE:-oraclelinux:9}
    networks:
      - psmdb
    depends_on:
      - kerberos
      - ldap
      - keycloak
      - cosmian
      - vault

  easyrsa:
    image: easyrsa/psmdb
    build:
      dockerfile: Dockerfile-easyrsa
      context: .
    command: /bin/true

  cosmian:
    image: cosmian/psmdb
    build:
      dockerfile: Dockerfile-cosmian
      context: .
    hostname: cosmian
    ports:
      - "9998:9998"
    networks:
      - psmdb
    depends_on:
      - easyrsa

  vault:
    image: vault/psmdb
    build:
      dockerfile: Dockerfile-vault
      context: .
    hostname: vault
    ports:
      - "8200:8200"
    networks:
      - psmdb
    depends_on:
      - easyrsa

  kerberos:
    image: kerberos/psmdb
    build:
      dockerfile: Dockerfile-kerberos
      context: .
    hostname: kerberos
    networks:
      - psmdb

  ldap:
    image: ldap/psmdb
    build:
      dockerfile: Dockerfile-ldap
      context: .
    hostname: ldap
    environment:
      - LDAP_ADMIN_USERNAME=admin
      - LDAP_ADMIN_PASSWORD=password
      - LDAP_USERS=pbm
      - LDAP_PASSWORDS=pbmpass
      - LDAP_ENABLE_TLS=yes
      - LDAP_REQUIRE_TLS=yes
      - LDAP_TLS_CERT_FILE=/opt/bitnami/openldap/certs/ldap.crt
      - LDAP_TLS_KEY_FILE=/opt/bitnami/openldap/certs/ldap.key
      - LDAP_TLS_CA_FILE=/opt/bitnami/openldap/certs/ca.crt
      - LDAP_TLS_VERIFY_CLIENTS=never
    ports:
      - "1389:1389"
      - "1636:1636"
    networks:
      - psmdb
    depends_on:
      - easyrsa

  keycloak:
    image: keycloak/psmdb
    build:
      dockerfile: Dockerfile-keycloak
      context: .
    hostname: keycloak
    ports:
      - "8443:8443"
    networks:
      - psmdb
    depends_on:
      - easyrsa

networks:
  psmdb:
    name: psmdb-os
