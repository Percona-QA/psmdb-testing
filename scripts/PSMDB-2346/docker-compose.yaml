services:
  test:
    build:
      dockerfile: Dockerfile-test
      context: .
    image: psmdb-2346-test:pytest
    working_dir: /test
    networks:
      - psmdb-2346
    volumes:
      - .:/test
      - ./results:/results
      - /var/run/docker.sock:/var/run/docker.sock
    pid: host
    cap_add:
      - SYS_ADMIN
      - PERFMON
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    environment:
      PSMDB_IMAGE: ${PSMDB_IMAGE:-perconalab/percona-server-mongodb:9.0.4}
      COMMUNITY_IMAGE: ${COMMUNITY_IMAGE:-mongodb/mongodb-community-server:9.0.4-ubi9}
      YCSB_IMAGE: psmdb-2346-ycsb:mongodb-labs
      YCSB_RECORDCOUNT: ${YCSB_RECORDCOUNT:-800000}
      YCSB_OPERATIONCOUNT: ${YCSB_OPERATIONCOUNT:-6000000}
      YCSB_THREADS: ${YCSB_THREADS:-12}
      YCSB_CACHE_GB: ${YCSB_CACHE_GB:-2}
      YCSB_RESULTS_DIR: /results
      YCSB_NETWORK: psmdb-2346
    command: ["pytest", "-s"]

  ycsb:
    build:
      dockerfile: Dockerfile-ycsb
      context: .
    image: psmdb-2346-ycsb:mongodb-labs
    entrypoint: ["bin/ycsb"]
    networks:
      - psmdb-2346

networks:
  psmdb-2346:
    name: psmdb-2346
