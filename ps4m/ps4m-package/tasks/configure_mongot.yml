---
- name: Install curl for readiness checks
  package:
    name: curl
    state: present
  when: ansible_distribution != "Amazon"

- name: Generate mongot user password
  shell: openssl rand -base64 32 | tr -d '\n'
  register: mongot_password
  changed_when: false
  no_log: true

- name: Create mongot secrets directory
  file:
    path: /etc/mongot/secrets
    state: directory
    owner: root
    group: mongod
    mode: '0750'

- name: Install mongot password file
  copy:
    dest: /etc/mongot/secrets/passwordFile
    content: "{{ mongot_password.stdout }}"
    owner: mongod
    group: mongod
    mode: '0400'
  no_log: true

- name: stop mongod service
  service:
    name: mongod
    state: stopped

- name: add replica set name into mongod config
  replace:
    path: /etc/mongod.conf
    regexp: '^#replication:'
    replace: 'replication:\n  replSetName: "rs1"'

- name: start mongod service
  service:
    name: mongod
    state: started
    enabled: yes

- name: wait for mongod to be ready
  shell: mongosh --quiet --eval 'printjson(db.hello().ok)'
  register: mongodbready
  until: mongodbready.stdout | trim == '1'
  retries: 30
  delay: 2
  changed_when: false

- name: initiate mongod replica set
  shell: mongosh --quiet --eval 'try { rs.status(); } catch (e) { rs.initiate(); }'
  changed_when: false

- name: wait for mongod primary
  shell: mongosh --quiet --eval 'rs.status().members.some(m => m.stateStr === "PRIMARY")'
  register: mongod_primary
  until: mongod_primary.stdout | trim == 'true'
  retries: 30
  delay: 2
  changed_when: false

- name: create mongot user on mongod
  shell: >-
    mongosh --quiet --eval
    "const admin = db.getSiblingDB('admin');
    if (!admin.getUser('mongotUser')) {
      admin.createUser({
        user: 'mongotUser',
        pwd: '{{ mongot_password.stdout }}',
        roles: [{ role: 'searchCoordinator', db: 'admin' }]
      });
    }"
  no_log: true

- name: restart mongot service
  service:
    name: mongot
    state: restarted
    enabled: yes

- name: wait for mongot readiness endpoint
  block:
    - name: wait for mongot readiness endpoint
      shell: curl -sS --connect-timeout 2 --max-time 5 http://127.0.0.1:8080/ready
      register: mongot_readiness
      until: >
        mongot_readiness.rc == 0 and
        (mongot_readiness.stdout | default('{}', true) | from_json).status == "SERVING"
      retries: 60
      delay: 5
      changed_when: false
  rescue:
    - name: print last readiness attempt
      debug:
        msg:
          - "rc={{ mongot_readiness.rc | default('n/a') }}"
          - "stdout={{ mongot_readiness.stdout | default('') }}"
          - "stderr={{ mongot_readiness.stderr | default('') }}"

    - name: collect mongot diagnostics
      shell: |
        set +e
        echo "=== systemctl status mongot ==="
        systemctl status mongot --no-pager -l
        echo "=== journalctl -u mongot ==="
        journalctl -u mongot -n 200 --no-pager
        echo "=== listeners ==="
        ss -lntup | grep -E '8080|27028|27017|9946' || true
        echo "=== curl -sv http://localhost:8080/ready ==="
        curl -sv --connect-timeout 2 --max-time 5 http://localhost:8080/ready
        echo
        echo "=== curl -sv http://127.0.0.1:8080/ready ==="
        curl -sv --connect-timeout 2 --max-time 5 http://127.0.0.1:8080/ready
        echo
        echo "=== curl -sv http://[::1]:8080/ready ==="
        curl -sv --connect-timeout 2 --max-time 5 "http://[::1]:8080/ready"
        echo
        echo "=== getent ahosts localhost ==="
        getent ahosts localhost || true
        echo "=== memory ==="
        free -h
        echo "=== dmesg oom/kill ==="
        dmesg -T 2>/dev/null | grep -iE 'oom|mongot|killed process' | tail -20 || true
      register: mongot_diag
      changed_when: false
      failed_when: false

    - name: print mongot diagnostics
      debug:
        msg: "{{ mongot_diag.stdout_lines }}"

    - name: fail after mongot readiness timeout
      fail:
        msg: "mongot did not become ready on 127.0.0.1:8080. See diagnostics above."
