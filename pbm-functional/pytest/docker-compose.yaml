services:
  test:
    build:
      dockerfile: ./Dockerfile-testinfra
      context: .
    volumes:
      - .:/test
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - fs:/backups
    container_name: test
    hostname: test
    environment:
      - JIRA_SERVER=${JIRA_SERVER:-}
      - JIRA_USERNAME=${JIRA_USERNAME:-}
      - JIRA_PASSWORD=${JIRA_PASSWORD:-}
      - JENKINS_URL=${JENKINS_URL:-}
      - GIT_URL=https://github.com/percona/percona-backup-mongodb
      - GIT_BRANCH=${PBM_BRANCH:-dev}
      - KMS_ID=${KMS_ID:-}
    networks:
      - test

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite
    ports:
      - "10000:10000"
    networks:
      - test
    command: azurite-blob --skipApiVersionCheck --blobHost 0.0.0.0 -d /dev/stdout

  floci:
    image: floci/floci:latest
    container_name: floci
    hostname: floci
    ports:
      - "4566:4566"
    networks:
      - test
    environment:
      FLOCI_HOSTNAME: floci

  nginx-minio:
    build:
      dockerfile: ./Dockerfile-nginx
      context: .
    container_name: nginx-minio
    hostname: nginx-minio
    networks:
      - test
    depends_on:
      - floci
      - easyrsa

  createbucket:
    container_name: createbucket
    image: amazon/aws-cli
    networks:
      - test
    depends_on:
      - floci
    environment:
      AWS_ACCESS_KEY_ID: minio1234
      AWS_SECRET_ACCESS_KEY: minio1234
      AWS_DEFAULT_REGION: us-east-1
    entrypoint:
      - /bin/sh
      - -c
      - |
        until aws --endpoint-url http://floci:4566 s3 ls >/dev/null 2>&1; do sleep 2; done
        aws --endpoint-url http://floci:4566 s3 mb s3://bcp || true
    command: []

  fake-metadata:
    image: salrashid123/gcemetadataserver:latest
    container_name: fake-metadata
    hostname: fake-metadata
    networks:
      - test
    ports:
      - "8080:8080"
    environment:
      - GOOGLE_PROJECT_ID=test-project
      - GOOGLE_NUMERIC_PROJECT_ID=123456789
      - GOOGLE_SERVICE_ACCOUNT=pbm-test@test.iam.gserviceaccount.com
      - GOOGLE_ACCESS_TOKEN=dummy-token-for-emulator
      - GOOGLE_ID_TOKEN=dummy-id-token-for-emulator
    volumes:
      - ./conf/pbm/gce-metadata-config.json:/config.json:ro
    command: ["-port", ":8080", "-configFile", "/config.json", "--interface", "0.0.0.0"]

  cosmian:
    image: cosmian/local
    build:
      dockerfile: ./Dockerfile-cosmian
      context: .
    container_name: cosmian
    hostname: cosmian
    ports:
      - "9998:9998"
    networks:
      - test
    depends_on:
      - easyrsa

  vault:
    image: openbao/openbao
    container_name: vault
    hostname: vault
    ports:
      - "8200:8200"
    environment:
      - "BAO_DEV_ROOT_TOKEN_ID=vaulttoken"
    networks:
      - test

  kerberos:
    image: kerberos/local
    build:
      dockerfile: ./Dockerfile-kerberos
      context: .
    container_name: kerberos
    hostname: kerberos
    environment:
      - "KRB5_TRACE=/dev/stderr"
    networks:
      - test
    volumes:
      - keytabs:/keytabs

  ldap:
    image: bitnamilegacy/openldap
    container_name: ldap
    hostname: ldap
    environment:
      - "LDAP_ADMIN_USERNAME=admin"
      - "LDAP_ADMIN_PASSWORD=password"
      - "LDAP_USERS=pbm"
      - "LDAP_PASSWORDS=pbmpass"
    ports:
      - "1389:1389"
      - "1636:1636"
    networks:
      - test

  keycloak:
    image: keycloak/local
    build:
      dockerfile: ./Dockerfile-keycloak
      context: .
    container_name: keycloak
    hostname: keycloak
    ports:
      - "8443:8443"
    networks:
      - test

  build_member:
    image: replica_member/local
    build:
      dockerfile: ./Dockerfile
      context: .
      args:
        - PBM_BRANCH=${PBM_BRANCH:-dev}
        - GO_VER=${GO_VER:-bookworm}
        - PSMDB=${PSMDB:-percona/percona-server-mongodb:latest}
        - PR_NUMBER=${PR_NUMBER:-}
        - MAKE_TARGET=${MAKE_TARGET:-build}
    environment:
      - "PERCONA_TELEMETRY_URL=https://check-dev.percona.com/v1/telemetry/GenericReport"
    command: /bin/bash
    depends_on:
      - easyrsa

  easyrsa:
    image: easyrsa/local
    build:
      dockerfile: ./Dockerfile-easyrsa
      context: .
    command: /bin/bash

  golang_reports:
    image: golang:bookworm
    command: >
      /bin/sh -c " mkdir -p /gocoverdir/reports; chmod -R 777 /gocoverdir/reports; exit 0; "  
    volumes:
      - .:/test
      - gocoverdir:/gocoverdir

networks:
  test:
    name: test

volumes:
  fs:
    name: fs
  keytabs:
    name: keytabs
  gocoverdir:
    name: gocoverdir
