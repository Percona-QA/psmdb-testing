syncSource:
  replicaSet:
    hostAndPort: mongod:27017
    scramAuth:
      username: __system
      passwordFile: /etc/mongot/secrets/passwordFile
      authSource: local

storage:
  dataPath: /var/lib/mongot

server:
  grpc:
    address: 0.0.0.0:27028
    tls:
      mode: disabled

metrics:
  enabled: false

healthCheck:
  address: 0.0.0.0:8080

logging:
  verbosity: INFO

# Auto-embedding: enabled by the presence of this section
embedding:
  modelConfigFile: /etc/mongot/embedding-service-configs.yml
  # Single-node local stack: this mongot must be the materialized-view writer
  # (leader) that embeds documents. Without this it stays a follower, no lease
  # is created, and auto-embed indexes never leave PENDING/NOT_STARTED.
  isAutoEmbeddingViewWriter: true
