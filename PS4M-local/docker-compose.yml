name: PS4M-local

services:
  mongod:
    image: ${MONGOD_IMAGE:-perconalab/percona-server-mongodb:8.3.4-1}
    user: "0"
    hostname: mongod
    command:
      - bash
      - -ec
      - |
        install -d -m 0750 -o mongodb -g root /etc/mongodb
        install -m 0400 -o mongodb -g root /mnt/keyfile /etc/mongodb/keyfile
        chown -R mongodb:0 /var/lib/mongo
        if [ ! -f /var/lib/mongo/.replset-init ]; then
          gosu mongodb:1001 /entrypoint.sh mongod --config /etc/mongod.conf &
          pid=$$!
          until mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' >/dev/null 2>&1; do sleep 1; done
          mongosh --quiet --eval 'rs.initiate({_id:"rs", members:[{_id:0, host:"mongod:27017"}]})'
          until mongosh --quiet --eval 'db.hello().isWritablePrimary' >/dev/null 2>&1; do sleep 1; done
          mongosh --quiet --eval '
            db.getSiblingDB("admin").createUser({
              user: "root",
              pwd: "root",
              roles: [{ role: "root", db: "admin" }]
            })
          '
          kill -TERM "$$pid"
          wait "$$pid"
          touch /var/lib/mongo/.replset-init
        fi
        exec gosu mongodb:1001 /entrypoint.sh mongod --config /etc/mongod.conf
    ports:
      - "27017:27017"
    volumes:
      - ./config/mongod.conf:/etc/mongod.conf:ro
      - ./config/keyfile:/mnt/keyfile:ro
      - mongod_data:/var/lib/mongo
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "root",
          "-p",
          "root",
          "--authenticationDatabase",
          "admin",
          "--quiet",
          "--eval",
          "db.hello().isWritablePrimary",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - ps4m-local

  # OpenAI-compatible embedding backend for mongot auto-embedding: Hugging Face
  # Text Embeddings Inference (TEI). Serves /v1/embeddings on container port 80
  # (published on host :8085), keyless. The model is fixed at startup via
  # --model-id and downloaded once into the tei_data volume
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    hostname: tei
    command: ["--model-id", "BAAI/bge-small-en-v1.5"]
    ports:
      - "8085:80"
    volumes:
      - tei_data:/data
    networks:
      - ps4m-local

  # Second OpenAI-compatible backend. Lets you create indexes with Ollama-served models
  ollama:
    image: ollama/ollama:latest
    hostname: ollama
    entrypoint:
      - /bin/sh
      - -ec
      - |
        /bin/ollama serve &
        pid=$$!
        until /bin/ollama list >/dev/null 2>&1; do sleep 1; done
        /bin/ollama pull nomic-embed-text
        wait $$pid
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q nomic-embed-text || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 120s
    networks:
      - ps4m-local

  mongot:
    image: ${MONGOT_IMAGE:-perconalab/percona-server-mongodb-mongot:0.51.0-1}
    user: "0"
    hostname: mongot
    entrypoint:
      - bash
      - -ec
      - |
        install -d -m 0750 -o mongodb -g root /etc/mongot/secrets
        install -m 0400 -o mongodb -g root /mnt/keyfile /etc/mongot/secrets/passwordFile
        chown -R mongodb:0 /var/lib/mongot
        exec setpriv --reuid=1001 --regid=0 --init-groups /entrypoint.sh mongot --config /etc/mongot/mongot.yml
    ports:
      - "27028:27028"
      - "8080:8080"
    volumes:
      - ./config/mongot.yml:/etc/mongot/mongot.yml:ro
      - ./config/embedding-service-configs.yml:/etc/mongot/embedding-service-configs.yml:ro
      - ./config/keyfile:/mnt/keyfile:ro
      - mongot_data:/var/lib/mongot
    depends_on:
      mongod:
        condition: service_healthy
      # mongot embeds lazily (only at index/query time), so start order is
      # enough; the catalog's errorHandlingConfig retries while a backend
      # finishes downloading its model on first run.
      tei:
        condition: service_started
      ollama:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/ready >/dev/null || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - ps4m-local

volumes:
  mongod_data:
  mongot_data:
  tei_data:
  ollama_data:

networks:
  ps4m-local:
    driver: bridge
